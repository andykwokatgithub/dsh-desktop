<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #0d1117; color: #c9d1d9;
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid rgba(201,209,217,.2); border-top-color: #4d9fff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 16px; font-weight: 600; }
  .hint { font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">正在启动 DeepSeek Harness…</div>
  <div class="hint">正在加载 Web 界面</div>
</body>
</html>
