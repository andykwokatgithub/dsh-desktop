<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 32px;
    background: #0d1117; color: #c9d1d9;
    font-family: "Segoe UI", system-ui, sans-serif; text-align: center;
  }
  .icon { font-size: 44px; }
  .title { font-size: 18px; font-weight: 700; color: #f85149; }
  .msg { font-size: 13px; color: #8b949e; max-width: 520px; line-height: 1.6; }
  pre { color: #c9d1d9; font-size: 12px; }
  .actions { margin-top: 8px; display: flex; gap: 10px; }
  button {
    padding: 8px 18px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #30363d; }
</style>
</head>
<body>
  <div class="icon">⚠️</div>
  <div class="title">无法启动 DeepSeek Harness</div>
  <div class="msg" id="msg">发生未知错误。</div>
  <pre id="detail" style="display:none"></pre>
  <div class="actions">
    <button onclick="window.location.reload()">重试</button>
    <button onclick="location.href='https://github.com/deepseek-ai/deepseek-harness'">查看文档</button>
  </div>
</body>
</html>
