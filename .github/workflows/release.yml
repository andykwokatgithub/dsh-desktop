# Release pipeline for dsh-desktop.
# Triggered by a tag like v1.2.3. Builds the versioned Windows GUI binary,
# publishes it as a GitHub Release asset (with a SHA256 sidecar), and — when an
# NPM_TOKEN secret is present — publishes the npm package that dshmarket / the
# DSH plugin system consume.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install MinGW toolchain (for CGO / webview_go)
        run: choco install mingw -y --no-progress

      - name: Add MinGW to PATH
        run: |
          $mingw = "$env:ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingw) { Add-Content $env:GITHUB_PATH $mingw }

      - name: Resolve version
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v',''
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build (versioned)
        run: .\build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Stage release assets
        run: |
          $bin = "dsh-desktop.exe"
          $exe  = "dsh-desktop-win-x64.exe"
          $sha  = "dsh-desktop-win-x64.exe.sha256"
          $zip  = "dsh-desktop-win-x64.zip"
          Copy-Item $bin $exe
          $hash = (Get-FileHash -Algorithm SHA256 $bin).Hash.ToLower()
          "$hash  $exe" | Out-File -FilePath $sha -Encoding ascii
          Compress-Archive -Path $bin -DestinationPath $zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dsh-desktop.exe
            dsh-desktop-win-x64.exe
            dsh-desktop-win-x64.exe.sha256
            dsh-desktop-win-x64.zip

      - name: Publish npm package (optional)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
